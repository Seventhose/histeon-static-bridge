# OpenLiteSpeed server config of the disposable litespeed QA stack (setup-stack.sh). Loopback only, no
# WebAdmin, no HTTPS, no QUIC, no LSCache module. Compression stays as shipped by the image (gzip and
# Brotli on, static files compressed and cached by the server), as on a LiteSpeed host. As on shared hosting
# the server runs as nobody and PHP as the owner of the document root (setUIDMode 2: uid 1000, the stack owner).
serverName                sbqa-litespeed
user                      nobody
group                     nogroup
priority                  0
autoRestart               1
chrootPath                /
enableChroot              0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    30
mime                      conf/mime.properties
showVersionNumber         1
adminEmails               root@localhost
indexFiles                index.html, index.php
disableWebAdmin           1

# Logs stay inside the container (docker exec … cat /usr/local/lsws/logs/error.log). With logLevel WARN this image
# answers 503 to every PHP request (lsphp never takes the request); INFO and DEBUG work.
errorlog logs/error.log {
  logLevel                INFO
  debugLevel              0
  rollingSize             10M
  enableStderrLog         0
}

accessLog logs/access.log {
  rollingSize             10M
  keepDays                1
  compressArchive         0
}

tuning {
  maxConnections          200
  connTimeout             300
  maxKeepAliveReq         1000
  keepAliveTimeout        5
  enableGzipCompress      1
  enableBrCompress        4
  enableDynGzipCompress   1
  gzipCompressLevel       6
  gzipStaticCompressLevel 6
  brStaticCompressLevel   6
  compressibleTypes       default
  gzipAutoUpdateStatic    1
  gzipMinFileSize         300
  quicEnable              0
}

fileAccessControl {
  followSymbolLink        1
  checkSymbolLink         0
  requiredPermissionMask  000
  restrictedPermissionMask 000
}

CGIRLimit {
  maxCGIInstances         20
  minUID                  11
  minGID                  10
  priority                0
  CPUSoftLimit            10
  CPUHardLimit            50
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           20000
  procHardLimit           20000
}

accessControl {
  allow                   ALL
}

extProcessor lsphp {
  type                    lsapi
  address                 uds://tmp/lshttpd/lsphp.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  env                     LSAPI_AVOID_FORK=200M
  env                     PHPRC=@E@/conf/lsphp
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               1
  path                    fcgi-bin/lsphp
  backlog                 100
  instances               1
  priority                0
  memSoftLimit            0
  memHardLimit            0
  # RLIMIT_NPROC counts every process of uid 1000, the desktop session included: keep it out of the way.
  procSoftLimit           20000
  procHardLimit           20000
}

scriptHandler {
  add                     lsapi:lsphp php
}

virtualHost sbqa {
  vhRoot                  @E@/
  allowSymbolLink         1
  enableScript            1
  restrained              0
  setUIDMode              2
  configFile              conf/vhosts/sbqa/vhconf.conf
}

listener sbqa {
  address                 127.0.0.1:@PORT@
  secure                  0
  map                     sbqa *
}
