worker_processes 1;
pid @E@/run/nginx.pid;
error_log @E@/logs/nginx-error.log notice;
events { worker_connections 128; }
http {
  include @LW@/nginx-1.26.1+3/conf/includes/mime-types.conf.hbs;
  default_type application/octet-stream;
  access_log @E@/logs/nginx-access.log;
  client_body_temp_path @E@/run/client_body;
  fastcgi_temp_path @E@/run/fastcgi;
  proxy_temp_path @E@/run/proxy;
  scgi_temp_path @E@/run/scgi;
  uwsgi_temp_path @E@/run/uwsgi;
  sendfile off;
  charset utf-8;
  upstream php { server 127.0.0.1:@FPM_PORT@; }
  server {
    listen 127.0.0.1:@PORT@;
    root "@E@/wordpress";
    index index.php index.html index.htm;

    # Static Bridge block generated by the installed plugin (replaces location /).
    include @E@/conf/static-bridge.conf;

    rewrite ^(.*)(wp-admin)$ $1$2/ permanent;

    error_page 404 = @wperror;
    location @wperror {
      rewrite ^/(.*)$ /index.php?q=$1 last;
    }

    location ~ \.php$ {
      try_files $uri =404;
      fastcgi_split_path_info ^(.+\.php)(/.+)$;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param REQUEST_METHOD $request_method;
      fastcgi_param CONTENT_TYPE $content_type;
      fastcgi_param CONTENT_LENGTH $content_length;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param SCRIPT_NAME $fastcgi_script_name;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_param REQUEST_URI $request_uri;
      fastcgi_param DOCUMENT_URI $document_uri;
      fastcgi_param DOCUMENT_ROOT $document_root;
      fastcgi_param SERVER_PROTOCOL $server_protocol;
      fastcgi_param GATEWAY_INTERFACE CGI/1.1;
      fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
      fastcgi_param REMOTE_ADDR $remote_addr;
      fastcgi_param REMOTE_PORT $remote_port;
      fastcgi_param SERVER_ADDR $server_addr;
      fastcgi_param SERVER_PORT $server_port;
      fastcgi_param SERVER_NAME $host;
      fastcgi_param HTTP_HOST $http_host;
      fastcgi_param REDIRECT_STATUS 200;
      fastcgi_index index.php;
      fastcgi_pass php;
      fastcgi_read_timeout 180s;
    }
  }
}
