ServerRoot "@E@/run"
DefaultRuntimeDir "@E@/run"
PidFile "@E@/run/httpd.pid"
Mutex file:@E@/run default
Listen 127.0.0.1:@PORT@
ServerName 127.0.0.1:@PORT@
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
HostnameLookups Off
ErrorLog "@E@/logs/apache-error.log"
LogLevel warn
Include "@E@/conf/modules.conf"
LoadModule headers_module "@APX@/modules/mod_headers.so"

<Directory />
	Options FollowSymLinks
	AllowOverride None
	Require all denied
</Directory>
AccessFileName .htaccess
<FilesMatch "^\.ht">
	Require all denied
</FilesMatch>

<VirtualHost 127.0.0.1:@PORT@>
	ServerAdmin webmaster@localhost
	DocumentRoot "@E@/wordpress"
	ErrorLog "@E@/logs/apache-error.log"
	LogFormat "%h %l %u %t \"%r\" %>s %b %Dus" sbqa
	CustomLog "@E@/logs/apache-access.log" sbqa

	<Directory "@E@/wordpress">
		Options Indexes FollowSymLinks ExecCGI
		AllowOverride All
		Require all granted
	</Directory>

	# QA observability only (not part of the plugin's rules): mark successful responses
	# whose file Apache served from the Static Bridge tree.
	<Directory "@E@/wordpress/wp-content/static-bridge">
		Header set X-SBQA-Apache-File "static-bridge"
	</Directory>

	<FilesMatch \.php$>
		SetHandler "proxy:unix:@E@/run/fpm.sock|fcgi://unused-domain-string-but-required/"
	</FilesMatch>
	<Proxy fcgi://unused-domain-string-but-required>
		ProxySet connectiontimeout=5 timeout=240 flushpackets=on
	</Proxy>

	# LocalWP: if the php file doesn't exist, disable the proxy handler.
	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} \.php$
	RewriteCond %{DOCUMENT_ROOT}/%{REQUEST_URI} !-f
	RewriteRule (.*) - [H=text/html]

	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
</VirtualHost>
