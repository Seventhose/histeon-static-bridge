# Virtual host of the litespeed QA stack: the WordPress root reads its .htaccess as on a LiteSpeed host
# (autoLoadHtaccess). The plugin's own rules do the routing.
docRoot                   @E@/wordpress/
enableGzip                1

index {
  useServer               0
  indexFiles              index.html, index.php
  autoIndex               0
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1
  rewrite {
    RewriteFile           .htaccess
  }
}

rewrite {
  enable                  1
  autoLoadHtaccess        1
  logLevel                0
}

accessControl {
  allow                   *
}
